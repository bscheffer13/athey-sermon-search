<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="Search every word — find the moment. The Athey Creek Teaching Library lets you search every teaching transcript and jump to the exact moment in the audio." />
<title>Athey Creek Teaching Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,500;0,600;1,400;1,500&family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf9f6;        /* warm paper */
    --panel: #ffffff;     /* cards */
    --panel-2: #f1efe9;   /* inputs / hover */
    --text: #1c1f26;      /* near-black, warm */
    --muted: #6b7280;
    --accent: #2f6b4f;    /* deep moss — links, focus, timestamps (readable on light) */
    --hit: #4a3c00;       /* highlight text (dark amber) */
    --hit-bg: #ffe08a;    /* highlight background (light amber) */
    --border: #e3e0d8;    /* warm light border */
    --radius: 12px;
    --font-serif: 'Spectral', Georgia, serif;          /* display + scripture */
    --font-sans:  'Source Sans 3', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    --font-mono:  'IBM Plex Mono', ui-monospace, Menlo, monospace;
    --moss: #4A8A69;   /* brand-green accent (badge; swap --accent to use app-wide) */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font: 16px/1.5 var(--font-sans);
    background: var(--bg);
    color: var(--text);
    color-scheme: light;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 820px; margin: 0 auto; padding: 16px 16px 140px; }
  .brand { display: flex; align-items: center; gap: 11px; margin: 8px 0 2px; }
  .badge {
    width: 34px; height: 34px; border-radius: 999px; flex: none;
    background: var(--moss); color: #0F1115;
    display: inline-flex; align-items: center; justify-content: center;
    font-family: var(--font-serif); font-weight: 600; font-size: 16px;
  }
  header h1 {
    font-family: var(--font-serif);
    font-weight: 600;
    font-size: 1.6rem;
    letter-spacing: -0.01em;
    margin: 0;
  }
  header p { color: var(--muted); margin: 0 0 16px; font-size: .9rem; }

  .controls { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  select, input[type="search"] {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 14px;
    font-size: 1rem;
    outline: none;
  }
  select { flex: 0 0 auto; max-width: 100%; }
  input[type="search"] { flex: 1 1 220px; min-width: 0; }
  input[type="search"]:focus, select:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(47,107,79,0.22);   /* moss focus ring */
  }

  .meta { color: var(--muted); font-size: .85rem; margin: 4px 2px 12px; min-height: 1.2em; }

  ul.results { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  li.result {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 14px;
    cursor: pointer;
    transition: border-color .12s, background .12s;
  }
  li.result:hover, li.result:focus-visible { border-color: var(--accent); background: var(--panel-2); outline: none; }
  .ts {
    display: inline-block;
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    color: var(--accent);
    font-weight: 600;
    font-size: .82rem;
    margin-bottom: 4px;
  }
  .ctx { color: var(--muted); }
  .main { color: var(--text); }
  .src { color: var(--text); font-weight: 600; font-size: .8rem; letter-spacing: -0.01em; }
  .dot { color: var(--muted); margin: 0 6px; }
  mark { background: var(--hit-bg); color: var(--hit); border-radius: 3px; padding: 0 2px; }

  .player {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: var(--panel); border-top: 1px solid var(--border);
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
  }
  .player .inner { max-width: 820px; margin: 0 auto; }
  .now { font-size: .8rem; color: var(--muted); margin-bottom: 6px; }
  audio { width: 100%; }

  @media (max-width: 480px) {
    .wrap { padding-top: 8px; }
    header h1 { font-size: 1.15rem; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <span class="badge">ac</span>
        <h1>Teaching Library</h1>
      </div>
      <p>Search every word — find the moment.</p>
    </header>

    <div class="controls">
      <select id="sermon" aria-label="Filter by teaching"></select>
      <input id="q" type="search" placeholder="Search a word or phrase…" autocomplete="off" aria-label="Search transcript" />
    </div>
    <div class="meta" id="meta"></div>

    <ul class="results" id="results"></ul>
  </div>

  <div class="player">
    <div class="inner">
      <div class="now" id="now">Click a result to play</div>
      <audio id="audio" controls preload="none"></audio>
    </div>
  </div>

<script>
/* ----------------------------------------------------------------------------
 * Config — single source of truth
 * -------------------------------------------------------------------------- */

// Sermon registry. Adding a sermon = drop its JSON in final_output/ and add a row.
const SERMONS = [
  { id: "s2-574", title: "Marriage 101" },
  { id: "s2-575", title: "Teaching s2-575" },
];

// Where transcript JSON lives, relative to this page.
const TRANSCRIPT_PATH = (id) => `final_output/${id}.json`;

// Audio source — swap AUDIO_MODE to toggle between CloudFront (prod) and local media/ (dev).
const AUDIO_MODE = "cloudfront"; // "cloudfront" | "local"
const AUDIO_BASE = {
  cloudfront: (id) => `https://d2ecbaqsz6tho7.cloudfront.net/audio/teachings/${id}.mp3`,
  local:      (id) => `media/${id}.mp3`,
};
const audioUrl = (id) => AUDIO_BASE[AUDIO_MODE](id);

/* ----------------------------------------------------------------------------
 * State + elements
 * -------------------------------------------------------------------------- */
let library = [];     // [{ id, title, sentences: [{start,end,text}] }]
let playingId = null; // id of the sermon currently loaded in the audio element

// Safety cap on rendered results — cross-sermon searches can be large.
// This is the boundary that moves to SQLite/Postgres FTS5 when scaling to thousands.
const MAX_RESULTS = 500;

const els = {
  sermon: document.getElementById("sermon"),
  q: document.getElementById("q"),
  meta: document.getElementById("meta"),
  results: document.getElementById("results"),
  audio: document.getElementById("audio"),
  now: document.getElementById("now"),
};

/* ----------------------------------------------------------------------------
 * Helpers
 * -------------------------------------------------------------------------- */
const titleFor = (id) => (SERMONS.find((s) => s.id === id) || {}).title || id;

function mmss(sec) {
  sec = Math.max(0, Math.floor(sec));
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return `${m}:${String(s).padStart(2, "0")}`;
}

function escapeHtml(str) {
  return str.replace(/[&<>"']/g, (c) => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
  ));
}

function escapeRegExp(str) {
  return str.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
}

// Escape text, then wrap matches of `query` in <mark>. Query is treated as a literal phrase.
function highlight(text, query) {
  const safe = escapeHtml(text);
  if (!query) return safe;
  const re = new RegExp(escapeRegExp(escapeHtml(query)), "gi");
  return safe.replace(re, (m) => `<mark>${m}</mark>`);
}

/* ----------------------------------------------------------------------------
 * Data loading
 * -------------------------------------------------------------------------- */
// Fetch every sermon in the registry concurrently into `library`.
// One failing transcript doesn't sink the rest (Promise.allSettled).
async function loadLibrary() {
  els.meta.textContent = "Loading library…";
  const settled = await Promise.allSettled(
    SERMONS.map(async (s) => {
      const res = await fetch(TRANSCRIPT_PATH(s.id), { cache: "no-cache" });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return { id: s.id, title: s.title, sentences: await res.json() };
    })
  );

  library = settled.filter((r) => r.status === "fulfilled").map((r) => r.value);
  const failed = SERMONS.length - library.length;

  if (!library.length) {
    els.meta.textContent =
      "Failed to load transcripts. Serve over http (see README), not file://.";
    return;
  }
  els.meta.textContent = failed
    ? `Loaded ${library.length} of ${SERMONS.length} teachings (${failed} failed). Type to search.`
    : libraryStatus();
  runSearch();
}

// Point the audio element at a sermon (without seeking). Used when the active
// result or filter belongs to a sermon other than the one currently loaded.
function loadAudio(id) {
  playingId = id;
  els.audio.src = audioUrl(id);
  els.audio.load();
  els.now.textContent = `${titleFor(id)} (${id})`;
}

// Idle status line: how much of the library is loaded.
function libraryStatus() {
  if (!library.length) return els.meta.textContent;
  const total = library.reduce((n, s) => n + s.sentences.length, 0);
  return `${library.length} teaching${library.length === 1 ? "" : "s"}, ${total.toLocaleString()} sentences loaded. Type to search.`;
}

/* ----------------------------------------------------------------------------
 * Search
 * -------------------------------------------------------------------------- */
function runSearch() {
  const query = els.q.value.trim();
  els.results.innerHTML = "";

  if (!query) {
    els.meta.textContent = libraryStatus();
    return;
  }

  const needle = query.toLowerCase();
  const scope = els.sermon.value; // "all" or a sermon id
  const pool = scope === "all" ? library : library.filter((s) => s.id === scope);

  const hits = [];
  let capped = false;
  outer:
  for (const sermon of pool) {
    const arr = sermon.sentences;
    for (let i = 0; i < arr.length; i++) {
      if (arr[i].text.toLowerCase().includes(needle)) {
        hits.push({ sermon, i });
        if (hits.length >= MAX_RESULTS) { capped = true; break outer; }
      }
    }
  }

  if (!hits.length) {
    els.meta.textContent = `No results for “${query}”.`;
    return;
  }
  els.meta.textContent =
    `${hits.length}${capped ? "+" : ""} result${hits.length === 1 ? "" : "s"} for “${query}”` +
    (scope === "all" ? ` across ${pool.length} teaching${pool.length === 1 ? "" : "s"}.` : ".");

  const frag = document.createDocumentFragment();
  for (const hit of hits) frag.appendChild(renderHit(hit, query));
  els.results.appendChild(frag);
}

// Escaped text of a neighbor sentence (offset -1 = before, +1 = after), with a
// joining space on the correct side. Empty string when there is no such neighbor.
function neighborHtml(arr, i, offset) {
  const s = arr[i + offset];
  if (!s) return "";
  const text = escapeHtml(s.text);
  return offset < 0 ? text + " " : " " + text;
}

function renderHit(hit, query) {
  const { sermon, i } = hit;
  const arr = sermon.sentences;
  const s = arr[i];

  const li = document.createElement("li");
  li.className = "result";
  li.tabIndex = 0;
  li.innerHTML =
    `<span class="src">${escapeHtml(sermon.title)}</span>` +
    `<span class="dot">·</span><span class="ts">${mmss(s.start)}</span><br>` +
    `<span class="ctx">${neighborHtml(arr, i, -1)}</span>` +
    `<span class="main">${highlight(s.text, query)}</span>` +
    `<span class="ctx">${neighborHtml(arr, i, +1)}</span>`;

  const seek = () => playAt(sermon.id, s.start);
  li.addEventListener("click", seek);
  li.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); seek(); }
  });
  return li;
}

function seekAndPlay(start) {
  els.audio.currentTime = start;
  els.audio.play().catch(() => { /* autoplay may require a gesture; the click counts */ });
}

// Seek the player to `start` in sermon `id`, loading that sermon's audio first
// if it isn't the one currently in the player (then seeking once metadata is ready).
function playAt(id, start) {
  if (id === playingId) { seekAndPlay(start); return; }
  loadAudio(id);
  const onReady = () => {
    els.audio.removeEventListener("loadedmetadata", onReady);
    seekAndPlay(start);
  };
  els.audio.addEventListener("loadedmetadata", onReady);
}

/* ----------------------------------------------------------------------------
 * Wiring
 * -------------------------------------------------------------------------- */
function init() {
  const all = document.createElement("option");
  all.value = "all";
  all.textContent = "All teachings";
  els.sermon.appendChild(all);

  for (const s of SERMONS) {
    const opt = document.createElement("option");
    opt.value = s.id;
    opt.textContent = `${s.title} (${s.id})`;
    els.sermon.appendChild(opt);
  }

  els.sermon.addEventListener("change", () => {
    const v = els.sermon.value;
    if (v !== "all" && v !== playingId) loadAudio(v); // preload so it's directly playable
    runSearch();
  });

  let t;
  els.q.addEventListener("input", () => {
    clearTimeout(t);
    t = setTimeout(runSearch, 80);
  });

  loadLibrary();
}

init();
</script>
</body>
</html>
